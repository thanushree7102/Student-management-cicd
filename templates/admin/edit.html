{% extends "admin/base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<h2>Edit Student #{{ s.id }}</h2>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Student Name</label>
  <input type="text" name="name" value="{{ s.name }}" required>
  <label>USN</label>
  <input type="text" name="usn" value="{{ s.usn }}" required>
  <label>Department</label>
  <input type="text" name="dept" value="{{ s.dept }}" required>
  <input type="submit" value="Save Changes">
</form>
<p><a href="{{ url_for('admin.students') }}">&larr; Back</a></p>
{% endblock %}
